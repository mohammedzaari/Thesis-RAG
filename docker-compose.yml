# Usage: cp .env.example .env  (edit secrets)  &&  docker compose up --build -d
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes: [mongo_data:/data/db]          # not published: reachable only inside the Docker network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/thesis_rag?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-}
      SEED_ON_START: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    volumes: [uploads:/app/public/uploads]
    depends_on:
      mongo: { condition: service_healthy }

  web:
    build: ./frontend
    restart: unless-stopped
    ports: ["80:80"]
    depends_on: [api]

volumes:
  mongo_data:
  uploads:
